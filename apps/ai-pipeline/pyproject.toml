[project]
name = "ai-pipeline"
version = "0.1.0"
description = "AI processing pipeline for Rikkei Education documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]