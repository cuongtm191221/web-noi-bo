[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing Rikkei document tools"
requires-python = ">=3.12"
dependencies = [
    "mcp<2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]