services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rikkei-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rikkei}:${POSTGRES_PASSWORD:-rikkei_dev_password}@postgres:5432/${POSTGRES_DB:-rikkei_docs}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate with openssl rand -base64 32}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AI_PIPELINE_URL: http://ai-pipeline:8000
      UPLOADS_DIR: /uploads
      BACKUP_DIR: /backups
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin Rikkei}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Dev mode: mount source for hot-reload
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - uploads_data:/uploads
      - backups_data:/backups
    # Volumes override node_modules, so regenerate Prisma client at startup
    # Override in docker-compose.prod.yml for production
    command: >
      sh -c "npx prisma generate --schema=./apps/web/prisma/schema.prisma &&
             npm run dev --workspace=apps/web"

  postgres:
    image: postgres:16-alpine
    container_name: rikkei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rikkei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rikkei_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rikkei_docs}
      # Dev: trust auth on local network for easier debugging.
      # Production override: scram-sha-256 (see docker-compose.prod.yml)
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      # Dev: md5. Production override: scram-sha-256
      - "password_encryption=${PASSWORD_ENCRYPTION:-md5}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Dev: exposed on host for psql access. Production: bind to 127.0.0.1
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rikkei} -d ${POSTGRES_DB:-rikkei_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: rikkei-ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Dev: exposed. Production: bind to 127.0.0.1
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_NUM_CTX=8192

  ai-pipeline:
    build:
      context: ./apps/ai-pipeline
    container_name: rikkei-ai-pipeline
    profiles: ["ai"]
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rikkei}:${POSTGRES_PASSWORD:-rikkei_dev_password}@postgres:5432/${POSTGRES_DB:-rikkei_docs}
      STORAGE_URL: http://web:3000
      UPLOADS_DIR: /uploads
      # CORS — whitelist production domain
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${AI_PIPELINE_PORT:-8000}:8000"
    volumes:
      - uploads_data:/uploads

  mcp-server:
    build:
      context: ./apps/mcp-server
    container_name: rikkei-mcp-server
    profiles: ["mcp"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rikkei}:${POSTGRES_PASSWORD:-rikkei_dev_password}@postgres:5432/${POSTGRES_DB:-rikkei_docs}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_PORT: ${MCP_PORT:-8765}
    ports:
      - "${MCP_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    name: rikkei_postgres_data
  ollama_data:
    name: rikkei_ollama_data
  uploads_data:
    name: rikkei_uploads_data
  backups_data:
    name: rikkei_backups_data