services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rikkei-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://rikkei@postgres:5432/rikkei_docs
      AUTH_SECRET: dev_secret_change_in_production_min_32_chars_long
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    # Volumes override node_modules, so regenerate Prisma client at startup
    command: sh -c "npx prisma generate --schema=./apps/web/prisma/schema.prisma && npm run dev --workspace=apps/web"

  postgres:
    image: postgres:16-alpine
    container_name: rikkei-postgres
    restart: unless-stopped
    # NOTE for internal-only deployment (<50 users): trust auth on local network.
    # The DB is only exposed to the host network (no public exposure).
    # For production-grade hardening, switch to scram-sha-256 + strong password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rikkei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rikkei_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rikkei_docs}
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "password_encryption=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rikkei} -d ${POSTGRES_DB:-rikkei_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Placeholder for future plans
  ollama:
    image: ollama/ollama:latest
    container_name: rikkei-ollama
    profiles: ["ai"]  # Only start when --profile ai
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

  ai-pipeline:
    build:
      context: ./apps/ai-pipeline
    container_name: rikkei-ai-pipeline
    profiles: ["ai"]
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "${AI_PIPELINE_PORT:-8000}:8000"

  mcp-server:
    build:
      context: ./apps/mcp-server
    container_name: rikkei-mcp-server
    profiles: ["mcp"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rikkei}:${POSTGRES_PASSWORD:-rikkei_dev_password}@postgres:5432/${POSTGRES_DB:-rikkei_docs}
      MCP_API_KEY: ${MCP_API_KEY:-changeme_mcp_api_key}
    ports:
      - "${MCP_PORT:-8765}:8765"

volumes:
  postgres_data:
    name: rikkei_postgres_data
  ollama_data:
    name: rikkei_ollama_data
